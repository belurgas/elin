[package]
name = "elin"
version = "0.9.9"
description = "A beautiful Elixir + Erlang toolchain companion"
authors = ["Elin"]
edition = "2021"
license = "MIT"

[lib]
name = "elin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "deflate", "charset", "http2", "system-proxy"] }
tokio = { version = "1", features = ["fs", "process", "io-util", "rt-multi-thread", "macros", "time"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
dirs = "6"
which = "7"
regex = "1"
base64 = "0.22"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
once_cell = "1"
urlencoding = "2"
notify = "7"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
pretty_assertions = "1"
